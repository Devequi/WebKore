<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../css/geral.css">
    <link rel="stylesheet" href="../../css/paginasTreinador/lobbyTreinador.css">
</head>
<body>
    <header class="header">
        <img src="../../assets/logoWK.png" class="logo" alt=""> 
        <h1>WebKore</h1>
    </header>
    <main>
        <section class="infos">
            <h2>Treinador</h2>
            <h3>Lobby <strong>Treinador</strong></h3>
            <p>
                Selecione uma equipe para gerenciar sua equipe de desempenho ou crie uma equipe.
            </p>
        </section>

       <section class="pesquisa">
            <h2>Criação equipe</h2>
            <p>Começe a criar sua equipe.</p>
            <input type="button" value="Criar equipe" class="btn-criarEquipe">
        </section>

        <section class="cardsEquipes">
           <div class="team-card">
                <div class="team-header">
                    <img class="team-logo" src="https://cdn-icons-png.flaticon.com/512/53/53283.png" alt="Logo da equipe" />
                    <div class="team-info">
                    <h3 class="team-name">Equipe Sub-17</h3>
                    <p class="team-sport">Futebol</p>
                    </div>
                </div>

                <div class="team-footer">
                    <article class="campo-idEquipe">
                        <input type="text" class="idEquipe" value="Código de equipe: WK-0001-TEST" >
                        <button class="copiar">Copiar</button>
                    </article>
                    <button class="btn-enter">Entrar</button>
                </div>
            </div>

             <div class="team-card">
                <div class="team-header">
                    <img class="team-logo" src="https://cdn-icons-png.flaticon.com/512/53/53283.png" alt="Logo da equipe" />
                    <div class="team-info">
                    <h3 class="team-name">Equipe Sub-17</h3>
                    <p class="team-sport">Vôlei</p>
                    </div>
                </div>

                <div class="team-footer">
                    <article class="campo-idEquipe">
                        <input type="text" class="idEquipe" value="Código de equipe: WK-0001-TEST" >
                        <button class="copiar">Copiar</button>
                    </article>
                    <button class="btn-enter">Entrar</button>
                </div>
            </div>
        </section>
    </main>
    <footer>
    </footer>
    <script src="../../javascript/expandircard.js"></script>
</body>
</html>
